[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rnn-library"
version = "0.2.0"
description = "Simulate random recurrent networks with heterogeneous self-couplings and measure their reservoir of timescales."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolae Istrate" }]
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
notebook = ["notebook", "ipykernel"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/yawningbrain/multipleTimescalesRNN"
Paper = "https://arxiv.org/abs/2110.09165"

[tool.setuptools]
packages = ["rnn_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
